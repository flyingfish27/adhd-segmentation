  - label_name: sdq_totdiff__qbin
    target: sdq_totdiff
    method: quantile
    params: {k: 2, duplicates: drop}
    group_names: [low, high]
    source_id: sample_internal
    on_degenerate: keep

  - label_name: sdq_totdiff__qter
    target: sdq_totdiff
    method: quantile
    params: {k: 3, duplicates: drop}
    group_names: [low, mid, high]
    source_id: sample_internal
    on_degenerate: keep

  - label_name: sdq_totdiff__qquar
    target: sdq_totdiff
    method: quantile
    params: {k: 4, duplicates: drop}
    group_names: [q1, q2, q3, q4]
    source_id: sample_internal
    on_degenerate: keep

  # ---------------------------------------------------------------------------
  # 参考论文1(Wang, Sensors 2025)的 ADHD 口径,在本项目 24 人内重算
  #
  # 改名记录(TASK-8 决定2):本列旧名 snap_total__normT55。旧名里的 "norm"(常模)
  # 名不副实——下面 t_mean/t_sd 只是把 z 分线性搬到 T 分刻度上,而 z 的 mean/sd
  # 取自【这 24 个孩子自己】,不是任何人群常模。所以 t_cut: 55 实为"样本内 z >= 0.5"
  # (约取本样本前 31%)。analysis/chinese_norms.md:54,88 独立写了同一结论。
  # 新名字点名它是谁的口径:Wang 2025 用 T>=55,故 wang2025T55。
  # ---------------------------------------------------------------------------
  - label_name: snap_total__wang2025T55
    target: snap_total
    method: zscore_cut
    params: {ddof: 1, t_mean: 50, t_sd: 10, t_cut: 55}
    group_names: [below_cut, at_or_above_cut]
    source_id: wang2025_sensors
    on_degenerate: keep
    note: >-
      切点 55 来自参考论文1(Wang, Sensors 2025, 25(20):6459)的 ADHD 定义。
      注意两点:(1) 该 T 分是样本内 z 分换刻度,不是人群常模,论文层面无任何中国
      SNAP-IV 人群阈值(chinese_norms.md:54);(2) 论文在它自己的 50 人内算,
      本列在本项目建模子集 24 人内重算,故与论文的 13/37 不可直接比。

  # ---------------------------------------------------------------------------
  # 大陆家长版 SDQ 常模的多动异常线(标准 0-10 计分,>=8 判异常)
  #
  # on_degenerate: skip —— 本样本 0/24 人达到 8 分,列会是常数,不写进
  # target_labels.csv(与 TASK-8 之前的行为一致,保住"逐列复现 31 列"的等价性)。
  # 但 meta 表里仍留一行,把"我们试过大陆常模异常线、本样本无人达标"这条事实
  # 写在数据旁边,而不是只留在终端输出里。想让它变成常数列进表,把 skip 改 keep。
  # ---------------------------------------------------------------------------
  - label_name: sdq_hyper__norm8
    target: sdq_hyper
    method: raw_cut
    params: {cuts: [8]}
    group_names: [normal_or_borderline, abnormal]
    source_id: cn_sdq_parent_2013
    on_degenerate: skip
    note: >-
      切点 8 来自大陆 22,108 人家长版 SDQ 常模(PMC4054577)的多动/注意力子量表
      异常线(正常 0-6 / 边界 7 / 异常 8-10,按大陆本样本 90 百分位定)。
      前提是 SDQ 标准 0/1/2 计分,本数据 1-indexed 已在 40_targets.py 里减 1、
      反向题已翻转,故 targets.csv 的 sdq_hyper 就是 0-10 标准分,可直接对照。
      本列只用了异常线一条切点,没有把"边界 7"单独切出来;要三分组见 TASK-9。
